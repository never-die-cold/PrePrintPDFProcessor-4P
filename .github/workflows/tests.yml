name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.12"]
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      PYTHONNOUSERSITE: "1"     # 忽略用户级 site-packages，环境只来自本 venv
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # runner 镜像可能预装别的 pymupdf（实测 1.22.0 会串进来），
      # 因此依赖一律装进隔离 venv，后续步骤都用 venv 的 python
      - name: Create venv and install dependencies
        shell: bash
        run: |
          python -m venv .venv
          if [ -d .venv/Scripts ]; then BIN=.venv/Scripts; else BIN=.venv/bin; fi
          echo "$PWD/$BIN" >> "$GITHUB_PATH"
          "$BIN/python" -m pip install --upgrade pip
          "$BIN/python" -m pip install "pymupdf>=1.24.9" pillow numpy "ruff==0.17.0"

      - name: Install CJK fonts (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk

      - name: Show environment
        shell: bash
        run: |
          python --version
          python -c "import pymupdf, sys; print('python', sys.executable); print('pymupdf', pymupdf.version)"

      - name: Engine regression tests
        shell: bash
        run: python plugins/pdf-print-pack/tests/test_pack.py

      - name: Invariant tests
        shell: bash
        run: python plugins/pdf-print-pack/tests/test_invariants.py

      - name: Structure snapshot
        shell: bash
        run: python plugins/pdf-print-pack/tests/test_snapshot.py

      # 以下用例需要浏览器：runner 自带 Chrome/Edge，探测不到会自动 SKIP
      - name: HTML to PDF smoke tests
        shell: bash
        run: python plugins/pdf-print-pack/tests/test_html2pdf.py

      - name: HTML to PDF edge cases
        shell: bash
        run: python plugins/pdf-print-pack/tests/test_html2pdf_extra.py

      - name: Handout overflow checker
        shell: bash
        run: python plugins/pdf-print-pack/tests/test_check_handout.py

      - name: Windows SendTo installer
        shell: bash
        run: python plugins/pdf-print-pack/tests/test_sendto.py

      - name: Lint with ruff
        shell: bash
        run: python -m ruff check plugins/pdf-print-pack
